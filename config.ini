Networkname = eth0
port = 1080
; 监听地址：0.0.0.0（默认）| :: | 127.0.0.1 等，与 port 组合；也可写完整的 host:port，如 [::]:1080
listen = 0.0.0.0

; 地址来源：nic（添加 IP 到网卡，默认）| anyipv6（直接绑定整个前缀，仅 Linux）
mode = nic
; 选择方式：sequential（顺序，默认）| random（随机）| hash（按用户名/密码锁定 IP）
select = sequential
; anyipv6 使用的前缀，例如 2001:db8::/48；留空则从网卡获取
prefix =
; IPv4 兼容：off（默认，拒绝 IPv4 目标）| on（IPv4 目标和只有 A 记录的域名走系统默认 IPv4 出口，不经过地址池）
ipv4 = off
; 自定义域名解析文件，优先于 DNS；默认读取同目录下的 hosts，不存在则跳过
hosts = hosts
